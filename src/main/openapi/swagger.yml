openapi: 3.0.3
info:
  title: Artinola Spot Synchro Inator API
  description: API for synchronizing Artinola spots.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /sync:
    get:
      operationId: sync
      tags:
        - sync
      summary: Trigger calendar sync
      responses:
        '200':
          description: Trigger calendar sync from spreadsheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              example:
                status: ok
components:
  schemas:
    SyncResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
